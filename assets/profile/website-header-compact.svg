<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="550" viewBox="0 0 600 550" role="img" aria-labelledby="title desc">
  <title id="title">Mervine Muganguzi | Software Engineer</title>
  <desc id="desc">I build software that makes sense. To the people using it. To the engineers maintaining it. To the business it is meant to serve.</desc>
  <!-- Brand source: MerveilleDivine/mervine-dev, src/i18n/brandOverrides.ts,
       src/components/LiveCodeReviewHero.tsx and src/components/TubelightNavbar.tsx.
       The embedded logo is the original website asset, not a redrawn mark. -->
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7E69AB" stroke-opacity="0.036"/></pattern>
    <radialGradient id="glow" cx="50%" cy="4%" r="65%"><stop stop-color="#7E69AB" stop-opacity="0.2"/><stop offset="0.72" stop-color="#7E69AB" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="599" height="549" rx="12"/></clipPath>
    <clipPath id="logo-frame"><rect x="486" y="29" width="80" height="80" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="550" fill="#09090B"/>
    <rect width="600" height="550" fill="url(#grid)"/>
    <rect width="600" height="550" fill="url(#glow)"/>
    <text x="32" y="63" fill="#9B87F5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Mervine Muganguzi</text>
    <text x="32" y="91" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="18">Software Engineer</text>
    <image x="486" y="29" width="80" height="80" clip-path="url(#logo-frame)" xlink:href="data:image/webp;base64,"/>
    <path d="M32 132H568" stroke="#30363D"/>
    <g font-family="Inter, Arial, sans-serif">
      <text x="32" y="209" fill="#FAFAFA" font-size="54" font-weight="700" letter-spacing="-2.7">I build software</text>
      <text x="32" y="273" fill="#9B87F5" font-size="54" font-weight="700" letter-spacing="-2.7">that makes sense.</text>
      <g fill="#D4D4D8" font-size="24" font-weight="400">
        <text x="32" y="348">To the people using it.</text>
        <text x="32" y="384">To the engineers maintaining it.</text>
        <text x="32" y="420">To the business it is meant to serve.</text>
      </g>
      <text x="32" y="510" text-anchor="start" fill="#A1A1AA" font-size="18">mervine.dev</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="599" height="549" rx="12" fill="none" stroke="#30363D"/>
</svg>
